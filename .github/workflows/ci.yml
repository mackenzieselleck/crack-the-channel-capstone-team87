name: CI

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-typecheck-build:
    name: lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
            node-version: 20
            cache: npm
            cache-dependency-path: my-app/package-lock.json
      
      - name: install dependencies
        run: npm ci
      - name: run lint
        run: npm run lint
      - name: run typecheck
        run: npx tsc --noEmit
      - name: run build
        run: npm run build
      
  security-check:
    name: security scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
            node-version: 20
            cache: npm
            cache-dependency-path: my-app/package-lock.json
      
      - name: install dependencies
        run: npm ci
      - name: run dependency vulnerability audit
        run: npm audit --audit-level=high
        continue-on-error: true

